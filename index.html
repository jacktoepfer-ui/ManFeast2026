<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ManFeast 2026 Headquarters</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'feast-dark': '#0d1117',
                        'feast-card': '#161b22',
                        'feast-accent-red': '#cc3333',
                        'feast-accent-blue': '#0056b3',
                        'feast-gold': '#c5a059',
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #0d1117; color: #e6edf3; font-family: sans-serif; }
        input, select, textarea { color: white !important; }
        
        .btn-patriotic {
            background: linear-gradient(135deg, #cc3333 0%, #a02020 100%);
            border: 1px solid #701010;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            font-weight: 700;
        }
        .btn-patriotic:hover {
            background: linear-gradient(135deg, #e04040 0%, #b03030 100%);
        }

        input:focus, select:focus, textarea:focus {
            border-color: #0056b3 !important;
            box-shadow: 0 0 0 2px rgba(0, 86, 179, 0.5) !important;
        }

        .dot { transition: all 0.3s ease-in-out; }
        input:checked ~ .dot { transform: translateX(100%); background-color: white; }
        input:checked ~ .block { background-color: #0056b3; }

        .flag-bg {
            background-image: url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI0MCIgaGVpZ2h0PSIzMCIgdmlld0JveD0iMCAwIDQwIDMwIj48cmVjdCB3aWR0aD0iNDAiIGhlaWdodD0iMzAiIGZpbGw9IiNjYzMzMzMiLz48cmVjdCB4PSIyMCIgd2lkdGg9IjIwIiBoZWlnaHQ9IjE1IiBmaWxsPSIjMDA1NmIzIi8+PHJlY3Qgd2lkdGg9IjIwIiBoZWlnaHQ9IjE1IiBmaWxsPSJ3aGl0ZSIvPjwvc3ZnPg==');
            background-repeat: repeat;
            opacity: 0.03;
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none;
        }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-7xl mx-auto">
       <!-- HEADER -->
<header class="mb-10 pb-6 border-b-4 border-double border-feast-accent-blue">
    <!-- BANNER IMAGE -->
    <img src="banner.JPG" alt="ManFeast Banner" class="w-full max-h-64 object-cover rounded-xl mb-6 shadow-lg border border-gray-800">

    <h1 class="text-5xl font-extrabold text-feast-gold tracking-tight uppercase">ManFeast 2026 Headquarters</h1>
    <p class="text-xl text-gray-400 mt-2">RSVP & Food / Supply Roster</p>
</header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            
            <!-- FORM SECTION -->
            <section class="lg:col-span-1">
                <div class="bg-feast-card p-6 rounded-xl border-t-4 border-feast-accent-red shadow-2xl">
                    <h2 class="text-2xl font-bold text-white mb-6 uppercase tracking-wider">Claim Your Spot & Items</h2>
                    
                    <form id="rsvpForm" class="space-y-5">
                        <!-- Name -->
                        <div>
                            <label class="block text-sm font-medium text-gray-300">Your Name</label>
                            <input type="text" name="name" required class="mt-1 block w-full rounded-md bg-feast-dark border border-gray-700 p-3 shadow-inner">
                        </div>

                        <!-- Attending -->
                        <div>
                            <label class="block text-sm font-medium text-gray-300">Attending?</label>
                            <select name="attending" required class="mt-1 block w-full rounded-md bg-feast-dark border border-gray-700 p-3">
                                <option value="Yes">Yes, Sign Me Up</option>
                                <option value="No">No, I'm missing out</option>
                            </select>
                        </div>

                        <!-- Days Attending -->
                        <div>
                            <label class="block text-sm font-medium text-gray-300">Days Attending</label>
                            <div class="grid grid-cols-3 gap-3 mt-2">
                                <label class="flex items-center space-x-2 text-sm">
                                    <input type="checkbox" name="days" value="Oct 16" class="rounded border-gray-700 text-feast-accent-blue focus:ring-feast-accent-blue bg-feast-dark h-5 w-5">
                                    <span>Oct 16</span>
                                </label>
                                <label class="flex items-center space-x-2 text-sm">
                                    <input type="checkbox" name="days" value="Oct 17" class="rounded border-gray-700 text-feast-accent-blue focus:ring-feast-accent-blue bg-feast-dark h-5 w-5">
                                    <span>Oct 17</span>
                                </label>
                                <label class="flex items-center space-x-2 text-sm">
                                    <input type="checkbox" name="days" value="Oct 18" class="rounded border-gray-700 text-feast-accent-blue focus:ring-feast-accent-blue bg-feast-dark h-5 w-5">
                                    <span>Oct 18</span>
                                </label>
                            </div>
                        </div>

                        <!-- Sleeping Over -->
                        <div class="space-y-3">
                            <label class="block text-sm font-medium text-gray-300">Sleeping Over?</label>
                            <div class="flex items-center justify-between gap-4">
                                <span class="text-sm">Oct 16, 17</span>
                                <label for="toggle16" class="flex items-center cursor-pointer">
                                    <div class="relative">
                                        <input type="checkbox" id="toggle16" name="sleep16" class="sr-only">
                                        <div class="block bg-gray-600 w-14 h-8 rounded-full"></div>
                                        <div class="dot absolute left-1 top-1 bg-white w-6 h-6 rounded-full transition"></div>
                                    </div>
                                </label>
                            </div>
                            <div class="flex items-center justify-between gap-4">
                                <span class="text-sm">Oct 17, 18</span>
                                <label for="toggle17" class="flex items-center cursor-pointer">
                                    <div class="relative">
                                        <input type="checkbox" id="toggle17" name="sleep17" class="sr-only">
                                        <div class="block bg-gray-600 w-14 h-8 rounded-full"></div>
                                        <div class="dot absolute left-1 top-1 bg-white w-6 h-6 rounded-full transition"></div>
                                    </div>
                                </label>
                            </div>
                        </div>

                        <!-- Dish Type -->
                        <div>
                            <label class="block text-sm font-medium text-gray-300">Type of dish you're bringing</label>
                            <select name="category" required class="mt-1 block w-full rounded-md bg-feast-dark border border-gray-700 p-3">
                                <option value="" disabled selected>Select Category</option>
                                <option value="Meat/Main">Meat/Main Dish</option>
                                <option value="Side">Side Dish</option>
                                <option value="Snack">Snack</option>
                                <option value="Drink">Drink</option>
                                <option value="Dessert">Dessert</option>
                                <option value="Supplies">Supplies/Gear</option>
                            </select>
                        </div>

                        <!-- Preparation Status -->
                        <div>
                            <label class="block text-sm font-medium text-gray-300">Preparation Status</label>
                            <select name="prepStatus" required class="mt-1 block w-full rounded-md bg-feast-dark border border-gray-700 p-3">
                                <option value="" disabled selected>Select Status</option>
                                <option value="prepared and ready to eat">prepared and ready to eat</option>
                                <option value="prepared and needs warming up">prepared and needs warming up</option>
                                <option value="bringing ingredients and we're making it there">bringing ingredients and we're making it there</option>
                            </select>
                        </div>

                        <!-- Details -->
                        <div>
                            <label class="block text-sm font-medium text-gray-300">What are you bringing?</label>
                            <textarea name="details" rows="3" placeholder="e.g., 5lbs Smoked Brisket, Cooler & Ice" class="mt-1 block w-full rounded-md bg-feast-dark border border-gray-700 p-3"></textarea>
                        </div>

                        <button type="submit" class="w-full btn-patriotic text-white py-4 px-6 rounded-md shadow-lg transition duration-150">Submit / Update</button>
                    </form>
                </div>
            </section>

            <!-- ROSTER SECTION (SPLIT BY DAY) -->
            <section class="lg:col-span-2 space-y-6">
                <h2 class="text-3xl font-bold text-white uppercase tracking-wider">3-Day Feast Roster</h2>
                
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4" id="rosterContainer">
                    <div class="col-span-3 text-center py-10 text-gray-500">Loading roster...</div>
                </div>
            </section>
            
        </div>
        
        <footer class="mt-16 pt-8 border-t border-gray-800 text-center text-gray-600 text-sm">
            ManFeast 2026 | Est. 2023 | All rights reserved.
        </footer>
    </div>

<script>
       // GOOGLE APPS SCRIPT WEB APP URL:
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz4uLEmNo047VUJ03SAISxchr4e9EXF7P7c-jAmNjQiqrWUBv1685a4ulT9H5qLvsnx/exec";

const form = document.getElementById('rsvpForm');
const rosterContainer = document.getElementById('rosterContainer');

async function fetchRoster() {
    try {
        const response = await fetch(SCRIPT_URL, { redirect: "follow" });
        const data = await response.json();
        renderRosterByDay(data);
    } catch (error) {
        console.error('Error fetching roster:', error);
        rosterContainer.innerHTML = '<div class="col-span-3 text-center py-10 text-red-500">Error loading roster. Check Apps Script URL.</div>';
    }
}

function renderRosterByDay(data) {
    if (!data || data.length === 0) {
        rosterContainer.innerHTML = '<div class="col-span-3 text-center py-10 text-gray-500">No sign-ups yet.</div>';
        return;
    }

    // Standardize checking for attending status (case-insensitive)
    const activeData = data.filter(row => 
        row.name && 
        String(row.name).trim().toLowerCase() !== 'name' && 
        String(row.attending).trim().toLowerCase() === 'yes'
    );

    const days = ['Oct 16', 'Oct 17', 'Oct 18'];

    rosterContainer.innerHTML = days.map(day => {
        const dayGuests = activeData.filter(item => item.days && String(item.days).includes(day));

        return `
            <div class="bg-feast-card p-5 rounded-xl border border-gray-800 shadow-xl flex flex-col h-full">
                <div class="pb-3 mb-4 border-b-2 border-feast-accent-red flex justify-between items-center">
                    <h3 class="text-xl font-extrabold text-feast-gold uppercase">${day}</h3>
                    <span class="text-xs bg-feast-dark text-feast-accent-blue px-2.5 py-1 rounded-full font-bold border border-feast-accent-blue">${dayGuests.length} Attending</span>
                </div>

                <div class="space-y-4 flex-grow">
                    ${dayGuests.length === 0 ? '<p class="text-gray-500 text-sm italic">No guests signed up for this day yet.</p>' : ''}
                    
                    ${dayGuests.map(item => `
                        <div class="bg-feast-dark p-4 rounded-lg border border-gray-800 relative overflow-hidden">
                            <div class="flag-bg"></div>
                            <div class="relative z-10">
                                <div class="flex justify-between items-start">
                                    <h4 class="font-bold text-white text-base">${item.name}</h4>
                                </div>

                                ${(day === 'Oct 16' && String(item.sleep16).toLowerCase() === 'yes') || (day === 'Oct 17' && String(item.sleep17).toLowerCase() === 'yes') ? `
                                    <span class="inline-block mt-1 text-[10px] bg-indigo-900/80 text-indigo-200 px-2 py-0.5 rounded border border-indigo-700 uppercase font-semibold">⛺ Sleeping Over</span>
                                ` : ''}

                                ${item.details ? `
                                    <div class="mt-3 pt-2 border-t border-gray-800 text-xs">
                                        <p class="text-gray-300"><strong class="text-feast-gold uppercase">${item.category || 'Dish'}:</strong> ${item.details}</p>
                                        ${item.prepStatus ? `<p class="text-[11px] text-gray-400 mt-1 italic">${item.prepStatus}</p>` : ''}
                                    </div>
                                ` : '<p class="text-xs text-gray-500 mt-2 italic">No dish listed</p>'}
                            </div>
                        </div>
                    `).join('')}
                </div>
            </div>
        `;
    }).join('');
}

form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const submitBtn = form.querySelector('button[type="submit"]');
    submitBtn.disabled = true;
    submitBtn.innerText = 'Submitting...';

    const formData = new FormData(form);
    const data = {};
    formData.forEach((value, key) => {
        if (key === 'days') {
            if (!data[key]) data[key] = [];
            data[key].push(value);
        } else {
            data[key] = value;
        }
    });
    
    if (data.days) data.days = data.days.join(', ');

    data.sleep16 = data.sleep16 ? 'Yes' : 'No';
    data.sleep17 = data.sleep17 ? 'Yes' : 'No';

    try {
        // Post as URLSearchParams with no-cors mode to ensure Google Apps Script accepts it
        const searchParams = new URLSearchParams();
        Object.keys(data).forEach(key => searchParams.append(key, data[key]));

        await fetch(SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: {
                'Content-Type': 'application/x-www-form-urlencoded'
            },
            body: searchParams
        });

        form.reset();
        setTimeout(fetchRoster, 1500); // Small delay to let Apps Script finish appending to Sheet
    } catch (error) {
        console.error('Error submitting RSVP:', error);
        alert('There was an error submitting your RSVP. Please try again.');
    } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = 'Submit / Update';
    }
});

fetchRoster();
    </script>
</body>
</html>
