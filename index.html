<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feast Event RSVP & Roster</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'feast-dark': '#0f172a',
                        'feast-card': '#1e293b',
                        'feast-gold': '#f59e0b',
                        'feast-accent-red': '#ef4444',
                        'feast-accent-blue': '#3b82f6'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-feast-dark text-gray-100 font-sans min-h-screen p-4 md:p-8">

    <div class="max-w-6xl mx-auto space-y-8">
        <!-- Header -->
        <div class="text-center space-y-2">
            <h1 class="text-3xl md:text-5xl font-black text-feast-gold uppercase tracking-wider">Feast RSVP & Roster</h1>
            <p class="text-gray-400 text-sm md:text-base">Sign up, edit your attendance, and list food contributions per day.</p>
        </div>

        <!-- RSVP Form Section -->
        <div class="bg-feast-card p-6 md:p-8 rounded-2xl border border-gray-800 shadow-2xl">
            <h2 class="text-2xl font-bold text-white mb-6 border-b border-gray-700 pb-2">RSVP / Edit Entry</h2>
            
            <form id="rsvpForm" class="space-y-6">
                <!-- Name & Attending -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-semibold text-gray-300 mb-2">Full Name *</label>
                        <input type="text" name="name" required placeholder="Enter your full name" 
                            class="w-full bg-feast-dark border border-gray-700 rounded-lg px-4 py-2.5 text-white focus:outline-none focus:border-feast-gold">
                        <span class="text-xs text-gray-400 mt-1 block">Entering an existing name will update that entry.</span>
                    </div>

                    <div>
                        <label class="block text-sm font-semibold text-gray-300 mb-2">Attending? *</label>
                        <select name="attending" required class="w-full bg-feast-dark border border-gray-700 rounded-lg px-4 py-2.5 text-white focus:outline-none focus:border-feast-gold">
                            <option value="Yes">Yes, attending</option>
                            <option value="No">No, unable to make it</option>
                        </select>
                    </div>
                </div>

                <!-- Days Attending & Overnights -->
                <div class="space-y-3">
                    <label class="block text-sm font-semibold text-gray-300">Days Attending & Sleeping Over</label>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <label class="flex items-center space-x-3 bg-feast-dark p-3.5 rounded-lg border border-gray-700 cursor-pointer">
                            <input type="checkbox" name="days" value="Oct 16" class="day-checkbox w-4 h-4 text-feast-gold rounded">
                            <span class="text-sm font-semibold text-white">Friday, Oct 16</span>
                        </label>

                        <label class="flex items-center space-x-3 bg-feast-dark p-3.5 rounded-lg border border-gray-700 cursor-pointer">
                            <input type="checkbox" name="days" value="Oct 17" class="day-checkbox w-4 h-4 text-feast-gold rounded">
                            <span class="text-sm font-semibold text-white">Saturday, Oct 17</span>
                        </label>

                        <label class="flex items-center space-x-3 bg-feast-dark p-3.5 rounded-lg border border-gray-700 cursor-pointer">
                            <input type="checkbox" name="days" value="Oct 18" class="day-checkbox w-4 h-4 text-feast-gold rounded">
                            <span class="text-sm font-semibold text-white">Sunday, Oct 18</span>
                        </label>
                    </div>

                    <div class="flex flex-wrap gap-6 pt-2">
                        <label class="inline-flex items-center space-x-2 cursor-pointer">
                            <input type="checkbox" name="sleep16" value="Yes" class="w-4 h-4 text-indigo-600 rounded">
                            <span class="text-xs text-gray-300">Sleeping over Friday Night (Oct 16)</span>
                        </label>
                        <label class="inline-flex items-center space-x-2 cursor-pointer">
                            <input type="checkbox" name="sleep17" value="Yes" class="w-4 h-4 text-indigo-600 rounded">
                            <span class="text-xs text-gray-300">Sleeping over Saturday Night (Oct 17)</span>
                        </label>
                    </div>
                </div>

                <!-- Dynamic Daily Food Fields -->
                <div class="space-y-4 pt-4 border-t border-gray-800">
                    <h3 class="text-lg font-bold text-feast-gold">Food Contributions per Day</h3>
                    
                    <!-- Oct 16 Food -->
                    <div id="foodBlock16" class="hidden bg-feast-dark p-4 rounded-lg border border-gray-800 grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div class="md:col-span-1">
                            <label class="block text-xs font-semibold text-gray-400 mb-1">Oct 16 Category</label>
                            <input type="text" name="food16Category" placeholder="e.g. Main, Side, Drink" class="w-full bg-feast-card border border-gray-700 rounded px-3 py-1.5 text-xs text-white">
                        </div>
                        <div class="md:col-span-2">
                            <label class="block text-xs font-semibold text-gray-400 mb-1">Oct 16 Dish / Item Details</label>
                            <input type="text" name="food16Details" placeholder="e.g. Pulled Pork (5 lbs)" class="w-full bg-feast-card border border-gray-700 rounded px-3 py-1.5 text-xs text-white">
                        </div>
                    </div>

                    <!-- Oct 17 Food -->
                    <div id="foodBlock17" class="hidden bg-feast-dark p-4 rounded-lg border border-gray-800 grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div class="md:col-span-1">
                            <label class="block text-xs font-semibold text-gray-400 mb-1">Oct 17 Category</label>
                            <input type="text" name="food17Category" placeholder="e.g. Breakfast, Dessert" class="w-full bg-feast-card border border-gray-700 rounded px-3 py-1.5 text-xs text-white">
                        </div>
                        <div class="md:col-span-2">
                            <label class="block text-xs font-semibold text-gray-400 mb-1">Oct 17 Dish / Item Details</label>
                            <input type="text" name="food17Details" placeholder="e.g. Pancakes & Syrup" class="w-full bg-feast-card border border-gray-700 rounded px-3 py-1.5 text-xs text-white">
                        </div>
                    </div>

                    <!-- Oct 18 Food -->
                    <div id="foodBlock18" class="hidden bg-feast-dark p-4 rounded-lg border border-gray-800 grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div class="md:col-span-1">
                            <label class="block text-xs font-semibold text-gray-400 mb-1">Oct 18 Category</label>
                            <input type="text" name="food18Category" placeholder="e.g. Snack, Utensils" class="w-full bg-feast-card border border-gray-700 rounded px-3 py-1.5 text-xs text-white">
                        </div>
                        <div class="md:col-span-2">
                            <label class="block text-xs font-semibold text-gray-400 mb-1">Oct 18 Dish / Item Details</label>
                            <input type="text" name="food18Details" placeholder="e.g. Potato Chips & Dip" class="w-full bg-feast-card border border-gray-700 rounded px-3 py-1.5 text-xs text-white">
                        </div>
                    </div>
                </div>

                <button type="submit" class="w-full bg-feast-gold hover:bg-yellow-500 text-feast-dark font-extrabold py-3.5 rounded-lg transition duration-200 shadow-lg uppercase tracking-wide">
                    Submit / Update Entry
                </button>
            </form>
        </div>

        <!-- Roster Table Section -->
        <div class="bg-feast-card p-6 md:p-8 rounded-2xl border border-gray-800 shadow-2xl">
            <h2 class="text-2xl font-bold text-white mb-6 border-b border-gray-700 pb-2 flex justify-between items-center">
                <span>Master Event Roster</span>
                <button onclick="fetchRoster()" class="text-xs bg-feast-dark hover:bg-gray-800 text-gray-300 border border-gray-700 px-3 py-1 rounded">Refresh</button>
            </h2>

            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse min-w-[700px]">
                    <thead>
                        <tr class="bg-feast-dark border-b border-gray-700 text-xs text-feast-gold uppercase">
                            <th class="p-3">Attendee</th>
                            <th class="p-3">Friday, Oct 16</th>
                            <th class="p-3">Saturday, Oct 17</th>
                            <th class="p-3">Sunday, Oct 18</th>
                        </tr>
                    </thead>
                    <tbody id="rosterTableBody" class="divide-y divide-gray-800 text-sm">
                        <tr>
                            <td colspan="4" class="text-center py-8 text-gray-400">Loading roster data...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz4uLEmNo047VUJ03SAISxchr4e9EXF7P7c-jAmNjQiqrWUBv1685a4ulT9H5qLvsnx/exec";

        const form = document.getElementById('rsvpForm');
        const rosterTableBody = document.getElementById('rosterTableBody');
        const dayCheckboxes = document.querySelectorAll('.day-checkbox');

        // Toggle visibility of per-day food input fields dynamically
        dayCheckboxes.forEach(cb => {
            cb.addEventListener('change', () => {
                const dayVal = cb.value;
                let blockId = '';
                if (dayVal === 'Oct 16') blockId = 'foodBlock16';
                if (dayVal === 'Oct 17') blockId = 'foodBlock17';
                if (dayVal === 'Oct 18') blockId = 'foodBlock18';

                const block = document.getElementById(blockId);
                if (block) {
                    if (cb.checked) {
                        block.classList.remove('hidden');
                    } else {
                        block.classList.add('hidden');
                    }
                }
            });
        });

        async function fetchRoster() {
            try {
                const response = await fetch(SCRIPT_URL, { redirect: "follow" });
                const data = await response.json();
                renderTableRoster(data);
            } catch (error) {
                console.error('Error fetching roster:', error);
                rosterTableBody.innerHTML = '<tr><td colspan="4" class="text-center py-8 text-red-500">Error loading roster. Verify script deployment.</td></tr>';
            }
        }

        function renderTableRoster(data) {
            if (!data || data.length === 0) {
                rosterTableBody.innerHTML = '<tr><td colspan="4" class="text-center py-8 text-gray-500">No sign-ups found yet.</td></tr>';
                return;
            }

            const activeData = data.filter(row => 
                row.name && 
                String(row.name).trim().toLowerCase() !== 'name' && 
                String(row.attending).trim().toLowerCase() === 'yes'
            );

            if (activeData.length === 0) {
                rosterTableBody.innerHTML = '<tr><td colspan="4" class="text-center py-8 text-gray-500">No attendees signed up as attending.</td></tr>';
                return;
            }

            rosterTableBody.innerHTML = activeData.map(item => {
                const daysAttending = String(item.days || '');

                const renderDayCell = (dayTag, sleepKey, catKey, detKey) => {
                    const isAttendingDay = daysAttending.includes(dayTag);
                    if (!isAttendingDay) {
                        return '<span class="text-gray-600 text-xs italic">Not attending</span>';
                    }

                    const isSleeping = String(item[sleepKey] || '').toLowerCase() === 'yes';
                    const category = item[catKey] ? String(item[catKey]).trim() : '';
                    const details = item[detKey] ? String(item[detKey]).trim() : '';

                    return `
                        <div class="space-y-1">
                            <span class="inline-block text-[10px] bg-green-900/60 text-green-300 border border-green-700 px-1.5 py-0.5 rounded font-semibold">Attending</span>
                            ${isSleeping ? '<span class="inline-block text-[10px] bg-indigo-900/60 text-indigo-300 border border-indigo-700 px-1.5 py-0.5 rounded font-semibold">⛺ Overnight</span>' : ''}
                            ${details ? `
                                <div class="text-xs pt-1">
                                    <strong class="text-feast-gold">${category ? category + ':' : 'Food:'}</strong> ${details}
                                </div>
                            ` : '<div class="text-[11px] text-gray-500 italic">No food listed</div>'}
                        </div>
                    `;
                };

                return `
                    <tr class="hover:bg-gray-800/40 transition">
                        <td class="p-3 font-bold text-white border-b border-gray-800 align-top">${item.name}</td>
                        <td class="p-3 border-b border-gray-800 align-top">${renderDayCell('Oct 16', 'sleep16', 'food16Category', 'food16Details')}</td>
                        <td class="p-3 border-b border-gray-800 align-top">${renderDayCell('Oct 17', 'sleep17', 'food17Category', 'food17Details')}</td>
                        <td class="p-3 border-b border-gray-800 align-top">${renderDayCell('Oct 18', '', 'food18Category', 'food18Details')}</td>
                    </tr>
                `;
            }).join('');
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const submitBtn = form.querySelector('button[type="submit"]');
            submitBtn.disabled = true;
            submitBtn.innerText = 'Saving...';

            const formData = new FormData(form);
            const data = {};

            formData.forEach((value, key) => {
                if (key === 'days') {
                    if (!data[key]) data[key] = [];
                    data[key].push(value);
                } else {
                    data[key] = value;
                }
            });

            data.sleep16 = form.querySelector('[name="sleep16"]')?.checked ? 'Yes' : 'No';
            data.sleep17 = form.querySelector('[name="sleep17"]')?.checked ? 'Yes' : 'No';

            try {
                await fetch(SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(data)
                });

                form.reset();
                
                // Hide food input blocks after form reset
                ['foodBlock16', 'foodBlock17', 'foodBlock18'].forEach(id => {
                    const block = document.getElementById(id);
                    if (block) block.classList.add('hidden');
                });

                setTimeout(() => {
                    fetchRoster();
                    submitBtn.disabled = false;
                    submitBtn.innerText = 'Submit / Update Entry';
                }, 2000);

            } catch (error) {
                console.error('Error submitting RSVP:', error);
                alert('Could not submit RSVP. Please try again.');
                submitBtn.disabled = false;
                submitBtn.innerText = 'Submit / Update Entry';
            }
        });

        fetchRoster();
    </script>
</body>
</html>
