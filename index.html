<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MANFEAST 2026 - RSVP & Roster</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'feast-dark': '#0a0d14',
                        'feast-card': '#121824',
                        'feast-gold': '#f59e0b',
                        'feast-red': '#dc2626',
                        'feast-blue': '#2563eb'
                    }
                }
            }
        }
    </script>
    <style>
        /* Ambient Page Texture Overlay */
        .page-bg {
            background-color: #07090e;
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(220, 38, 38, 0.15), transparent 40%),
                radial-gradient(circle at 80% 20%, rgba(37, 99, 235, 0.12), transparent 40%);
            background-attachment: fixed;
        }

        .banner-shadow {
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.9), 0 0 25px rgba(220, 38, 38, 0.25);
        }

        .gold-glow {
            text-shadow: 0 0 12px rgba(245, 158, 11, 0.4);
        }
    </style>
</head>
<body class="page-bg text-gray-100 font-sans min-h-screen p-3 sm:p-6 md:p-8">

    <div class="max-w-5xl mx-auto space-y-8">
        
        <!-- Header Banner Section -->
        <div class="flex flex-col items-center">
            <div class="w-full max-w-2xl overflow-hidden rounded-2xl border-2 border-red-700/60 banner-shadow bg-feast-dark relative group">
                <!-- Main Poster Banner Image -->
                <img src="banner.JPG" alt="MANFEAST 2026 - Food, Fire & Freedom" class="w-full h-auto object-cover block mx-auto">
                <div class="absolute inset-0 ring-1 ring-inset ring-white/10 rounded-2xl pointer-events-none"></div>
            </div>
            
            <div class="mt-4 text-center">
                <span class="inline-block bg-red-900/60 text-feast-gold border border-red-600/60 px-4 py-1 rounded-full text-xs font-black uppercase tracking-widest">
                    ★ GUYS WEEKEND • FOOD, FIRE & FREEDOM ★
                </span>
            </div>
        </div>

        <!-- RSVP Form Card -->
        <div class="bg-feast-card/95 p-6 md:p-8 rounded-2xl border-2 border-feast-gold/40 shadow-2xl backdrop-blur-md relative overflow-hidden">
            <div class="absolute top-0 left-0 right-0 h-1.5 bg-gradient-to-r from-red-600 via-white to-blue-600"></div>
            
            <h2 class="text-2xl font-black text-feast-gold mb-6 border-b border-gray-800 pb-3 flex items-center justify-between uppercase tracking-wide">
                <span>★ RSVP / Edit Registration</span>
                <span class="text-xs font-normal text-gray-400 capitalize hidden sm:inline">Enter full name to update existing entry</span>
            </h2>
            
            <form id="rsvpForm" class="space-y-6">
                <!-- Name & Attending Status -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-xs font-bold text-gray-300 uppercase tracking-wider mb-2">Full Name *</label>
                        <input type="text" name="name" required placeholder="First and Last Name" 
                            class="w-full bg-feast-dark/90 border border-gray-700 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-feast-gold transition shadow-inner">
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-gray-300 uppercase tracking-wider mb-2">Attending Status *</label>
                        <select name="attending" required class="w-full bg-feast-dark/90 border border-gray-700 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-feast-gold transition shadow-inner">
                            <option value="Yes">Yes, I will be attending!</option>
                            <option value="No">No, unable to make it</option>
                        </select>
                    </div>
                </div>

                <!-- Days & Sleeping Over -->
                <div class="space-y-3 pt-2">
                    <label class="block text-xs font-bold text-gray-300 uppercase tracking-wider">Select Days Attending</label>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <label class="flex items-center space-x-3 bg-feast-dark/80 p-4 rounded-xl border border-gray-700 hover:border-red-500 cursor-pointer transition">
                            <input type="checkbox" name="days" value="Oct 16" class="day-checkbox w-5 h-5 text-red-600 rounded border-gray-600 focus:ring-0">
                            <div>
                                <span class="text-sm font-bold text-white block">Friday, Oct 16</span>
                                <span class="text-[11px] text-gray-400">Arrival & Setup</span>
                            </div>
                        </label>

                        <label class="flex items-center space-x-3 bg-feast-dark/80 p-4 rounded-xl border border-gray-700 hover:border-feast-gold cursor-pointer transition">
                            <input type="checkbox" name="days" value="Oct 17" class="day-checkbox w-5 h-5 text-feast-gold rounded border-gray-600 focus:ring-0">
                            <div>
                                <span class="text-sm font-bold text-white block">Saturday, Oct 17</span>
                                <span class="text-[11px] text-feast-gold font-semibold">🔥 THE FEAST DAY 🔥</span>
                            </div>
                        </label>

                        <label class="flex items-center space-x-3 bg-feast-dark/80 p-4 rounded-xl border border-gray-700 hover:border-blue-500 cursor-pointer transition">
                            <input type="checkbox" name="days" value="Oct 18" class="day-checkbox w-5 h-5 text-blue-600 rounded border-gray-600 focus:ring-0">
                            <div>
                                <span class="text-sm font-bold text-white block">Sunday, Oct 18</span>
                                <span class="text-[11px] text-gray-400">Breakfast & Pack Up</span>
                            </div>
                        </label>
                    </div>

                    <!-- Overnight Stay Options -->
                    <div class="flex flex-wrap gap-6 pt-3 px-1">
                        <label class="inline-flex items-center space-x-2 cursor-pointer">
                            <input type="checkbox" name="sleep16" value="Yes" class="w-4 h-4 text-indigo-500 rounded border-gray-700">
                            <span class="text-xs text-indigo-300 font-medium">⛺ Sleeping Over Friday Night (Oct 16)</span>
                        </label>
                        <label class="inline-flex items-center space-x-2 cursor-pointer">
                            <input type="checkbox" name="sleep17" value="Yes" class="w-4 h-4 text-indigo-500 rounded border-gray-700">
                            <span class="text-xs text-indigo-300 font-medium">⛺ Sleeping Over Saturday Night (Oct 17)</span>
                        </label>
                    </div>
                </div>

                <!-- Dynamic Daily Food Fields -->
                <div class="space-y-4 pt-4 border-t border-gray-800">
                    <h3 class="text-sm font-bold text-feast-gold uppercase tracking-wider">Food & Drink Contributions per Day</h3>
                    
                    <!-- Oct 16 Food -->
                    <div id="foodBlock16" class="hidden bg-feast-dark/90 p-4 rounded-xl border border-red-500/40 grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div>
                            <label class="block text-[11px] font-bold text-red-400 uppercase mb-1">Oct 16 Category</label>
                            <input type="text" name="food16Category" placeholder="e.g. Snacks, Beer, Bourbon" class="w-full bg-feast-card border border-gray-700 rounded-lg px-3 py-2 text-xs text-white">
                        </div>
                        <div class="md:col-span-2">
                            <label class="block text-[11px] font-bold text-red-400 uppercase mb-1">Oct 16 Item Details</label>
                            <input type="text" name="food16Details" placeholder="e.g. Case of Craft Beer & Chips" class="w-full bg-feast-card border border-gray-700 rounded-lg px-3 py-2 text-xs text-white">
                        </div>
                    </div>

                    <!-- Oct 17 Food -->
                    <div id="foodBlock17" class="hidden bg-feast-dark/90 p-4 rounded-xl border border-yellow-500/40 grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div>
                            <label class="block text-[11px] font-bold text-yellow-400 uppercase mb-1">Oct 17 Category</label>
                            <input type="text" name="food17Category" placeholder="e.g. Main Dish, Side, Cigars" class="w-full bg-feast-card border border-gray-700 rounded-lg px-3 py-2 text-xs text-white">
                        </div>
                        <div class="md:col-span-2">
                            <label class="block text-[11px] font-bold text-yellow-400 uppercase mb-1">Oct 17 Item Details</label>
                            <input type="text" name="food17Details" placeholder="e.g. Smoked Pork Shoulder & Sauce" class="w-full bg-feast-card border border-gray-700 rounded-lg px-3 py-2 text-xs text-white">
                        </div>
                    </div>

                    <!-- Oct 18 Food -->
                    <div id="foodBlock18" class="hidden bg-feast-dark/90 p-4 rounded-xl border border-blue-500/40 grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div>
                            <label class="block text-[11px] font-bold text-blue-400 uppercase mb-1">Oct 18 Category</label>
                            <input type="text" name="food18Category" placeholder="e.g. Breakfast, Coffee" class="w-full bg-feast-card border border-gray-700 rounded-lg px-3 py-2 text-xs text-white">
                        </div>
                        <div class="md:col-span-2">
                            <label class="block text-[11px] font-bold text-blue-400 uppercase mb-1">Oct 18 Item Details</label>
                            <input type="text" name="food18Details" placeholder="e.g. Sausage & Bacon Bagels" class="w-full bg-feast-card border border-gray-700 rounded-lg px-3 py-2 text-xs text-white">
                        </div>
                    </div>
                </div>

                <button type="submit" class="w-full bg-gradient-to-r from-red-600 via-red-500 to-blue-700 hover:from-red-500 hover:to-blue-600 text-white font-black py-4 rounded-xl transition duration-200 shadow-xl uppercase tracking-widest border border-feast-gold/40">
                    ★ Submit / Update Entry ★
                </button>
            </form>
        </div>

        <!-- Roster Table Section -->
        <div class="bg-feast-card/95 p-6 md:p-8 rounded-2xl border-2 border-feast-gold/40 shadow-2xl backdrop-blur-md relative overflow-hidden">
            <div class="absolute top-0 left-0 right-0 h-1.5 bg-gradient-to-r from-blue-600 via-white to-red-600"></div>

            <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-6 border-b border-gray-800 pb-3">
                <h2 class="text-2xl font-black text-feast-gold uppercase tracking-wide flex items-center space-x-2">
                    <span>★ MANFEAST 2026 Master Roster</span>
                </h2>
                <button onclick="fetchRoster()" class="text-xs bg-feast-dark hover:bg-gray-800 text-feast-gold border border-feast-gold/40 px-4 py-2 rounded-lg font-bold transition">
                    ↻ Refresh Roster
                </button>
            </div>

            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse min-w-[700px]">
                    <thead>
                        <tr class="bg-feast-dark/90 border-b-2 border-feast-gold/40 text-xs text-feast-gold uppercase tracking-wider">
                            <th class="p-4 rounded-tl-lg">Attendee Name</th>
                            <th class="p-4">Friday (Oct 16)</th>
                            <th class="p-4">Saturday (Oct 17)</th>
                            <th class="p-4 rounded-tr-lg">Sunday (Oct 18)</th>
                        </tr>
                    </thead>
                    <tbody id="rosterTableBody" class="divide-y divide-gray-800 text-sm">
                        <tr>
                            <td colspan="4" class="text-center py-10 text-gray-400">Loading roster entries...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz4uLEmNo047VUJ03SAISxchr4e9EXF7P7c-jAmNjQiqrWUBv1685a4ulT9H5qLvsnx/exec";

        const form = document.getElementById('rsvpForm');
        const rosterTableBody = document.getElementById('rosterTableBody');
        const dayCheckboxes = document.querySelectorAll('.day-checkbox');

        // Dynamic Food Inputs Visibility Toggle
        dayCheckboxes.forEach(cb => {
            cb.addEventListener('change', () => {
                const dayVal = cb.value;
                let blockId = '';
                if (dayVal === 'Oct 16') blockId = 'foodBlock16';
                if (dayVal === 'Oct 17') blockId = 'foodBlock17';
                if (dayVal === 'Oct 18') blockId = 'foodBlock18';

                const block = document.getElementById(blockId);
                if (block) {
                    if (cb.checked) {
                        block.classList.remove('hidden');
                    } else {
                        block.classList.add('hidden');
                    }
                }
            });
        });

        async function fetchRoster() {
            try {
                const response = await fetch(SCRIPT_URL, { redirect: "follow" });
                const data = await response.json();
                renderTableRoster(data);
            } catch (error) {
                console.error('Error fetching roster:', error);
                rosterTableBody.innerHTML = '<tr><td colspan="4" class="text-center py-10 text-red-400 font-semibold">Error loading roster. Check Google Script setup.</td></tr>';
            }
        }

        function renderTableRoster(data) {
            if (!data || data.length === 0) {
                rosterTableBody.innerHTML = '<tr><td colspan="4" class="text-center py-10 text-gray-400">No RSVP submissions yet.</td></tr>';
                return;
            }

            const activeData = data.filter(row => 
                row.name && 
                String(row.name).trim().toLowerCase() !== 'name' && 
                String(row.attending).trim().toLowerCase() === 'yes'
            );

            if (activeData.length === 0) {
                rosterTableBody.innerHTML = '<tr><td colspan="4" class="text-center py-10 text-gray-400">No active attendees registered as attending.</td></tr>';
                return;
            }

            rosterTableBody.innerHTML = activeData.map(item => {
                const daysAttending = String(item.days || '');

                const renderDayCell = (dayTag, sleepKey, catKey, detKey) => {
                    const isAttendingDay = daysAttending.includes(dayTag);
                    if (!isAttendingDay) {
                        return '<span class="text-gray-600 text-xs italic">Not attending</span>';
                    }

                    const isSleeping = String(item[sleepKey] || '').toLowerCase() === 'yes';
                    const category = item[catKey] ? String(item[catKey]).trim() : '';
                    const details = item[detKey] ? String(item[detKey]).trim() : '';

                    return `
                        <div class="space-y-1.5">
                            <div class="flex flex-wrap gap-1">
                                <span class="inline-block text-[10px] bg-emerald-900/80 text-emerald-300 border border-emerald-600/60 px-2 py-0.5 rounded font-bold uppercase">Attending</span>
                                ${isSleeping ? '<span class="inline-block text-[10px] bg-indigo-900/80 text-indigo-200 border border-indigo-600/60 px-2 py-0.5 rounded font-bold uppercase">⛺ Overnight</span>' : ''}
                            </div>
                            ${details ? `
                                <div class="text-xs pt-1 border-t border-gray-800">
                                    <strong class="text-feast-gold uppercase text-[11px]">${category ? category + ':' : 'Item:'}</strong> <span class="text-gray-200">${details}</span>
                                </div>
                            ` : '<div class="text-[11px] text-gray-500 italic">No food item listed</div>'}
                        </div>
                    `;
                };

                return `
                    <tr class="hover:bg-gray-800/50 transition">
                        <td class="p-4 font-bold text-white border-b border-gray-800/80 align-top">${item.name}</td>
                        <td class="p-4 border-b border-gray-800/80 align-top">${renderDayCell('Oct 16', 'sleep16', 'food16Category', 'food16Details')}</td>
                        <td class="p-4 border-b border-gray-800/80 align-top">${renderDayCell('Oct 17', 'sleep17', 'food17Category', 'food17Details')}</td>
                        <td class="p-4 border-b border-gray-800/80 align-top">${renderDayCell('Oct 18', '', 'food18Category', 'food18Details')}</td>
                    </tr>
                `;
            }).join('');
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const submitBtn = form.querySelector('button[type="submit"]');
            submitBtn.disabled = true;
            submitBtn.innerText = '★ Submitting Entry... ★';

            const formData = new FormData(form);
            const data = {};

            formData.forEach((value, key) => {
                if (key === 'days') {
                    if (!data[key]) data[key] = [];
                    data[key].push(value);
                } else {
                    data[key] = value;
                }
            });

            data.sleep16 = form.querySelector('[name="sleep16"]')?.checked ? 'Yes' : 'No';
            data.sleep17 = form.querySelector('[name="sleep17"]')?.checked ? 'Yes' : 'No';

            try {
                await fetch(SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(data)
                });

                form.reset();
                
                ['foodBlock16', 'foodBlock17', 'foodBlock18'].forEach(id => {
                    const block = document.getElementById(id);
                    if (block) block.classList.add('hidden');
                });

                setTimeout(() => {
                    fetchRoster();
                    submitBtn.disabled = false;
                    submitBtn.innerText = '★ Submit / Update Entry ★';
                }, 2000);

            } catch (error) {
                console.error('Error submitting RSVP:', error);
                alert('Could not submit RSVP. Please try again.');
                submitBtn.disabled = false;
                submitBtn.innerText = '★ Submit / Update Entry ★';
            }
        });

        fetchRoster();
    </script>
</body>
</html>
