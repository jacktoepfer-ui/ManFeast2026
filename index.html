<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MANFEAST 2026 - RSVP & Roster</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'feast-dark': '#0b0f17',
                        'feast-card': '#141c2b'
                    }
                }
            }
        }
    </script>
    <style>
        .page-bg {
            background-color: #07090e;
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(225, 29, 72, 0.18), transparent 45%),
                radial-gradient(circle at 80% 20%, rgba(37, 99, 235, 0.12), transparent 45%);
            background-attachment: fixed;
        }

        .banner-shadow {
            box-shadow: 0 15px 30px -10px rgba(0, 0, 0, 0.95), 0 0 20px rgba(225, 29, 72, 0.3);
        }
    </style>
</head>
<body class="page-bg text-gray-100 font-sans min-h-screen p-2.5 sm:p-6 md:p-8">

    <div class="max-w-4xl mx-auto space-y-6 sm:space-y-8">
        
        <!-- Header Banner Section -->
        <div class="flex flex-col items-center">
            <div class="w-full max-w-xl overflow-hidden rounded-xl sm:rounded-2xl border border-rose-700/60 banner-shadow bg-feast-dark relative">
                <img src="banner.JPG" alt="MANFEAST 2026" class="w-full h-auto object-cover block mx-auto">
            </div>
            
            <div class="mt-3 text-center">
                <span class="inline-block bg-rose-950/90 text-slate-100 border border-rose-600/70 px-3.5 py-1 rounded-full text-[10px] sm:text-xs font-black uppercase tracking-widest shadow-md">
                    ★ GUYS WEEKEND • FOOD, FIRE & FREEDOM ★
                </span>
            </div>
        </div>

        <!-- RSVP Form Card -->
        <div class="bg-feast-card p-4 sm:p-6 md:p-8 rounded-xl sm:rounded-2xl border border-slate-700/70 shadow-2xl relative overflow-hidden">
            <div class="absolute top-0 left-0 right-0 h-1 bg-gradient-to-r from-rose-600 via-slate-200 to-blue-600"></div>
            
            <div class="mb-5 border-b border-slate-800 pb-3">
                <h2 class="text-xl sm:text-2xl font-black text-white uppercase tracking-wide">
                    ★ RSVP / Edit Registration
                </h2>
                <p class="text-[11px] text-slate-400 mt-0.5">Enter your cell phone number to load existing details or start a new RSVP.</p>
            </div>
            
            <form id="rsvpForm" class="space-y-5">
                
                <!-- Phone Lookup Bar -->
                <div class="bg-feast-dark p-3 rounded-xl border border-rose-900/50 flex flex-col sm:flex-row gap-2 items-stretch">
                    <div class="flex-1">
                        <label class="block text-[10px] font-bold text-rose-400 uppercase tracking-wider mb-1">Cell Phone Number * (Key)</label>
                        <input type="tel" id="phoneInput" name="phone" required placeholder="10-digit phone number" 
                            class="w-full bg-feast-card border border-slate-700 rounded-lg px-3.5 py-2 text-sm text-white focus:outline-none focus:border-rose-500 transition shadow-inner">
                    </div>
                    <button type="button" id="lookupBtn" onclick="lookupUserByPhone()" class="sm:self-end bg-slate-800 hover:bg-slate-700 border border-slate-600 text-xs text-rose-300 font-bold px-4 py-2.5 rounded-lg transition">
                        🔍 Find My RSVP
                    </button>
                </div>

                <div id="lookupStatus" class="hidden text-xs font-semibold px-1"></div>

                <!-- Name & Attending Status -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-300 uppercase tracking-wider mb-1.5">Full Name *</label>
                        <input type="text" name="name" required placeholder="First and Last Name" 
                            class="w-full bg-feast-dark border border-slate-700 rounded-lg px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-rose-500 transition shadow-inner">
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-slate-300 uppercase tracking-wider mb-1.5">Attending Status *</label>
                        <select name="attending" required class="w-full bg-feast-dark border border-slate-700 rounded-lg px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-rose-500 transition shadow-inner">
                            <option value="Yes">Yes, I will be attending!</option>
                            <option value="No">No, unable to make it</option>
                        </select>
                    </div>
                </div>

                <!-- Days & Sleeping Over -->
                <div class="space-y-3 pt-2">
                    <label class="block text-xs font-bold text-slate-300 uppercase tracking-wider">Select Days Attending</label>
                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                        <label class="flex items-center space-x-3 bg-feast-dark p-3.5 rounded-xl border border-slate-800 hover:border-rose-500 cursor-pointer transition">
                            <input type="checkbox" name="days" value="Oct 16" class="day-checkbox w-5 h-5 text-rose-600 rounded border-slate-700 focus:ring-0">
                            <div>
                                <span class="text-xs sm:text-sm font-bold text-white block">Friday, Oct 16</span>
                                <span class="text-[10px] text-slate-400">Arrival, Dinner & Movie</span>
                            </div>
                        </label>

                        <label class="flex items-center space-x-3 bg-feast-dark p-3.5 rounded-xl border border-slate-800 hover:border-rose-500 cursor-pointer transition">
                            <input type="checkbox" name="days" value="Oct 17" class="day-checkbox w-5 h-5 text-rose-600 rounded border-slate-700 focus:ring-0">
                            <div>
                                <span class="text-xs sm:text-sm font-bold text-white block">Saturday, Oct 17</span>
                                <span class="text-[10px] text-rose-400 font-bold">🔥 THE FEAST 🔥</span>
                            </div>
                        </label>

                        <label class="flex items-center space-x-3 bg-feast-dark p-3.5 rounded-xl border border-slate-800 hover:border-blue-500 cursor-pointer transition">
                            <input type="checkbox" name="days" value="Oct 18" class="day-checkbox w-5 h-5 text-blue-600 rounded border-slate-700 focus:ring-0">
                            <div>
                                <span class="text-xs sm:text-sm font-bold text-white block">Sunday, Oct 18</span>
                                <span class="text-[10px] text-slate-400">Breakfast & Chill</span>
                            </div>
                        </label>
                    </div>

                    <!-- Overnight Stay Options -->
                    <div class="flex flex-col sm:flex-row gap-3 sm:gap-6 pt-2 px-1">
                        <label class="inline-flex items-center space-x-2 cursor-pointer">
                            <input type="checkbox" name="sleep16" value="Yes" class="w-4 h-4 text-indigo-500 rounded border-slate-700">
                            <span class="text-xs text-indigo-300 font-medium">⛺ Sleeping Over Friday Night (Oct 16)</span>
                        </label>
                        <label class="inline-flex items-center space-x-2 cursor-pointer">
                            <input type="checkbox" name="sleep17" value="Yes" class="w-4 h-4 text-indigo-500 rounded border-slate-700">
                            <span class="text-xs text-indigo-300 font-medium">⛺ Sleeping Over Saturday Night (Oct 17)</span>
                        </label>
                    </div>
                </div>

                <!-- Dynamic Daily Options -->
                <div class="space-y-4 pt-3 border-t border-slate-800">
                    
                    <!-- Oct 16 Block: Movie Suggestion + Optional Categories -->
                    <div id="foodBlock16" class="hidden bg-feast-dark p-4 rounded-xl border border-rose-900/60 space-y-3">
                        <div>
                            <label class="block text-xs font-bold text-rose-400 uppercase mb-1">🎬 Friday Night Movie Choice</label>
                            <input type="text" name="food16Details" placeholder="What movie do you want to watch Friday night?" class="w-full bg-feast-card border border-slate-700 rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-rose-500">
                        </div>

                        <div>
                            <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1.5">Friday Night Snacks / Drinks (Select Multiple)</label>
                            <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 text-xs">
                                <label class="flex items-center space-x-2 bg-feast-card p-2 rounded border border-slate-800 cursor-pointer">
                                    <input type="checkbox" name="food16Category" value="Late Night Snacks" class="rounded border-slate-700 text-rose-600">
                                    <span class="text-slate-300">Late Night Snacks</span>
                                </label>
                                <label class="flex items-center space-x-2 bg-feast-card p-2 rounded border border-slate-800 cursor-pointer">
                                    <input type="checkbox" name="food16Category" value="Pizza / Wings" class="rounded border-slate-700 text-rose-600">
                                    <span class="text-slate-300">Pizza / Wings</span>
                                </label>
                                <label class="flex items-center space-x-2 bg-feast-card p-2 rounded border border-slate-800 cursor-pointer">
                                    <input type="checkbox" name="food16Category" value="Bourbon / Drinks" class="rounded border-slate-700 text-rose-600">
                                    <span class="text-slate-300">Bourbon / Drinks</span>
                                </label>
                                <label class="flex items-center space-x-2 bg-feast-card p-2 rounded border border-slate-800 cursor-pointer">
                                    <input type="checkbox" name="food16Category" value="Beer / Chasers" class="rounded border-slate-700 text-rose-600">
                                    <span class="text-slate-300">Beer / Chasers</span>
                                </label>
                            </div>
                        </div>
                    </div>

                    <!-- Oct 17 Block: Multi-Category + Details -->
                    <div id="foodBlock17" class="hidden bg-feast-dark p-4 rounded-xl border border-rose-800/80 space-y-3">
                        <div>
                            <label class="block text-xs font-bold text-rose-300 uppercase mb-1.5">Oct 17 Feast Categories (Select Multiple)</label>
                            <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 text-xs">
                                <label class="flex items-center space-x-2 bg-feast-card p-2 rounded border border-slate-800 cursor-pointer">
                                    <input type="checkbox" name="food17Category" value="Main Meat" class="rounded border-slate-700 text-rose-600">
                                    <span class="text-slate-300">Main Meat</span>
                                </label>
                                <label class="flex items-center space-x-2 bg-feast-card p-2 rounded border border-slate-800 cursor-pointer">
                                    <input type="checkbox" name="food17Category" value="Side Dish / BBQ" class="rounded border-slate-700 text-rose-600">
                                    <span class="text-slate-300">Side Dish / BBQ</span>
                                </label>
                                <label class="flex items-center space-x-2 bg-feast-card p-2 rounded border border-slate-800 cursor-pointer">
                                    <input type="checkbox" name="food17Category" value="Dessert" class="rounded border-slate-700 text-rose-600">
                                    <span class="text-slate-300">Dessert</span>
                                </label>
                                <label class="flex items-center space-x-2 bg-feast-card p-2 rounded border border-slate-800 cursor-pointer">
                                    <input type="checkbox" name="food17Category" value="Bourbon / Whiskey" class="rounded border-slate-700 text-rose-600">
                                    <span class="text-slate-300">Bourbon / Whiskey</span>
                                </label>
                                <label class="flex items-center space-x-2 bg-feast-card p-2 rounded border border-slate-800 cursor-pointer">
                                    <input type="checkbox" name="food17Category" value="Craft Beer" class="rounded border-slate-700 text-rose-600">
                                    <span class="text-slate-300">Craft Beer</span>
                                </label>
                                <label class="flex items-center space-x-2 bg-feast-card p-2 rounded border border-slate-800 cursor-pointer">
                                    <input type="checkbox" name="food17Category" value="Cigars" class="rounded border-slate-700 text-rose-600">
                                    <span class="text-slate-300">Cigars</span>
                                </label>
                            </div>
                        </div>

                        <div>
                            <label class="block text-[10px] font-bold text-rose-300 uppercase mb-1">Oct 17 Item Details</label>
                            <input type="text" name="food17Details" placeholder="e.g. Smoked Pork Ribs & Blanton's Bourbon" class="w-full bg-feast-card border border-slate-700 rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-rose-500">
                        </div>
                    </div>

                    <!-- Oct 18 Block: Multi-Category + Details -->
                    <div id="foodBlock18" class="hidden bg-feast-dark p-4 rounded-xl border border-blue-900/60 space-y-3">
                        <div>
                            <label class="block text-xs font-bold text-blue-400 uppercase mb-1.5">Oct 18 Breakfast Categories (Select Multiple)</label>
                            <div class="grid grid-cols-2 sm:grid-cols-3 gap-2 text-xs">
                                <label class="flex items-center space-x-2 bg-feast-card p-2 rounded border border-slate-800 cursor-pointer">
                                    <input type="checkbox" name="food18Category" value="Breakfast Meat" class="rounded border-slate-700 text-blue-600">
                                    <span class="text-slate-300">Breakfast Meat</span>
                                </label>
                                <label class="flex items-center space-x-2 bg-feast-card p-2 rounded border border-slate-800 cursor-pointer">
                                    <input type="checkbox" name="food18Category" value="Eggs / Casserole" class="rounded border-slate-700 text-blue-600">
                                    <span class="text-slate-300">Eggs / Casserole</span>
                                </label>
                                <label class="flex items-center space-x-2 bg-feast-card p-2 rounded border border-slate-800 cursor-pointer">
                                    <input type="checkbox" name="food18Category" value="Bread / Bagels" class="rounded border-slate-700 text-blue-600">
                                    <span class="text-slate-300">Bread / Bagels</span>
                                </label>
                                <label class="flex items-center space-x-2 bg-feast-card p-2 rounded border border-slate-800 cursor-pointer">
                                    <input type="checkbox" name="food18Category" value="Coffee / Juice" class="rounded border-slate-700 text-blue-600">
                                    <span class="text-slate-300">Coffee / Juice</span>
                                </label>
                            </div>
                        </div>

                        <div>
                            <label class="block text-[10px] font-bold text-blue-400 uppercase mb-1">Oct 18 Item Details</label>
                            <input type="text" name="food18Details" placeholder="e.g. 2 Packs Bacon & Box of Coffee" class="w-full bg-feast-card border border-slate-700 rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-blue-500">
                        </div>
                    </div>
                </div>

                <!-- Solid Red Submit Button -->
                <button type="submit" class="w-full bg-rose-700 hover:bg-rose-600 text-white font-black py-3.5 rounded-xl transition duration-200 shadow-lg uppercase tracking-wider text-xs sm:text-sm border border-rose-500/50 mt-4">
                    ★ Submit / Update Entry ★
                </button>
            </form>
        </div>

        <!-- Master Roster Card -->
        <div class="bg-feast-card p-4 sm:p-6 md:p-8 rounded-xl sm:rounded-2xl border border-slate-700/70 shadow-2xl relative overflow-hidden">
            <div class="absolute top-0 left-0 right-0 h-1 bg-gradient-to-r from-blue-600 via-slate-200 to-rose-600"></div>

            <div class="flex flex-row items-center justify-between gap-2 mb-4 border-b border-slate-800 pb-3">
                <h2 class="text-lg sm:text-2xl font-black text-white uppercase tracking-wide">
                    ★ Master Roster
                </h2>
                <button onclick="fetchRoster()" class="text-[11px] sm:text-xs bg-feast-dark hover:bg-slate-800 text-slate-200 border border-slate-700 px-3 py-1.5 rounded-lg font-bold transition">
                    ↻ Refresh
                </button>
            </div>

            <!-- Mobile View -->
            <div id="rosterMobileView" class="block md:hidden space-y-3">
                <div class="text-center py-6 text-xs text-slate-400">Loading roster...</div>
            </div>

            <!-- Desktop View -->
            <div class="hidden md:block overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-feast-dark border-b border-slate-700 text-xs text-slate-300 uppercase tracking-wider">
                            <th class="p-3">Attendee Name</th>
                            <th class="p-3">Friday (Oct 16)</th>
                            <th class="p-3">Saturday (Oct 17)</th>
                            <th class="p-3">Sunday (Oct 18)</th>
                        </tr>
                    </thead>
                    <tbody id="rosterTableBody" class="divide-y divide-slate-800 text-sm">
                        <tr>
                            <td colspan="4" class="text-center py-8 text-slate-400">Loading roster entries...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz4uLEmNo047VUJ03SAISxchr4e9EXF7P7c-jAmNjQiqrWUBv1685a4ulT9H5qLvsnx/exec";

        const form = document.getElementById('rsvpForm');
        const phoneInput = document.getElementById('phoneInput');
        const lookupStatus = document.getElementById('lookupStatus');
        const rosterTableBody = document.getElementById('rosterTableBody');
        const rosterMobileView = document.getElementById('rosterMobileView');
        const dayCheckboxes = document.querySelectorAll('.day-checkbox');

        function syncDayBlocks() {
            dayCheckboxes.forEach(cb => {
                let blockId = '';
                if (cb.value === 'Oct 16') blockId = 'foodBlock16';
                if (cb.value === 'Oct 17') blockId = 'foodBlock17';
                if (cb.value === 'Oct 18') blockId = 'foodBlock18';

                const block = document.getElementById(blockId);
                if (block) {
                    block.classList.toggle('hidden', !cb.checked);
                }
            });
        }

        dayCheckboxes.forEach(cb => cb.addEventListener('change', syncDayBlocks));

        phoneInput.addEventListener('input', (e) => {
            const raw = e.target.value.replace(/\D/g, '');
            if (raw.length === 10) {
                lookupUserByPhone();
            }
        });

        async function lookupUserByPhone() {
            const rawPhone = phoneInput.value.replace(/\D/g, '');
            if (rawPhone.length < 10) {
                showLookupStatus('Please enter a valid 10-digit phone number.', 'text-amber-400');
                return;
            }

            showLookupStatus('Searching for existing registration...', 'text-slate-400');

            try {
                const response = await fetch(`${SCRIPT_URL}?action=getSingle&phone=${rawPhone}&t=${Date.now()}`);
                const user = await response.json();

                if (user && user.name) {
                    populateForm(user);
                    showLookupStatus(`✓ Found entry for ${user.name}. Details populated below!`, 'text-emerald-400');
                } else {
                    showLookupStatus('No previous entry found. Complete form to register as new!', 'text-blue-400');
                }
            } catch (err) {
                console.error(err);
                showLookupStatus('Error looking up phone number.', 'text-rose-400');
            }
        }

        function showLookupStatus(msg, textClass) {
            lookupStatus.className = `text-xs font-semibold px-1 ${textClass}`;
            lookupStatus.innerText = msg;
            lookupStatus.classList.remove('hidden');
        }

        function setCheckboxesByName(name, valuesString) {
            const vals = String(valuesString || '').split(',').map(s => s.trim());
            const boxes = form.querySelectorAll(`[name="${name}"]`);
            boxes.forEach(cb => {
                cb.checked = vals.includes(cb.value);
            });
        }

        function populateForm(data) {
            form.querySelector('[name="name"]').value = data.name || '';
            form.querySelector('[name="attending"]').value = data.attending || 'Yes';

            const daysAttending = String(data.days || '');
            dayCheckboxes.forEach(cb => {
                cb.checked = daysAttending.includes(cb.value);
            });

            form.querySelector('[name="sleep16"]').checked = String(data.sleep16).toLowerCase() === 'yes';
            form.querySelector('[name="sleep17"]').checked = String(data.sleep17).toLowerCase() === 'yes';

            form.querySelector('[name="food16Details"]').value = data.food16Details || '';
            form.querySelector('[name="food17Details"]').value = data.food17Details || '';
            form.querySelector('[name="food18Details"]').value = data.food18Details || '';

            setCheckboxesByName('food16Category', data.food16Category);
            setCheckboxesByName('food17Category', data.food17Category);
            setCheckboxesByName('food18Category', data.food18Category);

            syncDayBlocks();
        }

        async function fetchRoster(retries = 2) {
            try {
                const response = await fetch(`${SCRIPT_URL}?t=${Date.now()}`, { redirect: 'follow' });
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const data = await response.json();
                renderRoster(data);
            } catch (error) {
                console.error('Fetch error:', error);
                if (retries > 0) {
                    setTimeout(() => fetchRoster(retries - 1), 1200);
                    return;
                }
                const errHtml = '<div class="text-center py-6 text-xs text-rose-400 font-semibold">Unable to load roster. Tap "Refresh".</div>';
                rosterMobileView.innerHTML = errHtml;
                rosterTableBody.innerHTML = `<tr><td colspan="4">${errHtml}</td></tr>`;
            }
        }

        function renderRoster(data) {
            if (!data || data.length === 0) {
                const emptyHtml = '<div class="text-center py-6 text-xs text-slate-400">No RSVP entries yet.</div>';
                rosterMobileView.innerHTML = emptyHtml;
                rosterTableBody.innerHTML = `<tr><td colspan="4">${emptyHtml}</td></tr>`;
                return;
            }

            const activeData = data.filter(row => 
                row.name && 
                String(row.name).trim().toLowerCase() !== 'name' && 
                String(row.attending).trim().toLowerCase() === 'yes'
            );

            if (activeData.length === 0) {
                const emptyHtml = '<div class="text-center py-6 text-xs text-slate-400">No registered attendees yet.</div>';
                rosterMobileView.innerHTML = emptyHtml;
                rosterTableBody.innerHTML = `<tr><td colspan="4">${emptyHtml}</td></tr>`;
                return;
            }

            // Desktop Table View
            rosterTableBody.innerHTML = activeData.map(item => {
                const daysList = String(item.days || '').split(',').map(d => d.trim());
                
                const renderCell = (dayTag, sleepKey, catKey, detKey) => {
                    if (!daysList.includes(dayTag)) {
                        return '<span class="text-slate-600 text-xs italic">Not attending</span>';
                    }
                    
                    const isSleeping = String(item[sleepKey] || '').toLowerCase() === 'yes';
                    const cat = item[catKey] ? String(item[catKey]).trim() : '';
                    const det = item[detKey] ? String(item[detKey]).trim() : '';

                    return `
                        <div class="space-y-1">
                            <div class="flex flex-wrap gap-1">
                                <span class="text-[10px] bg-emerald-950 text-emerald-300 border border-emerald-700/60 px-1.5 py-0.5 rounded font-bold uppercase">Attending</span>
                                ${isSleeping ? '<span class="text-[10px] bg-indigo-950 text-indigo-200 border border-indigo-700/60 px-1.5 py-0.5 rounded font-bold uppercase">⛺ Overnight</span>' : ''}
                            </div>
                            ${cat ? `<div class="text-[10px] text-rose-400 font-bold uppercase pt-1">Categories: ${cat}</div>` : ''}
                            ${det ? `
                                <div class="text-xs">
                                    <strong class="text-slate-400 uppercase text-[9px] block">${dayTag === 'Oct 16' ? '🎬 Movie Suggestion:' : 'Item Details:'}</strong>
                                    <span class="text-slate-200">${det}</span>
                                </div>
                            ` : (!cat ? `<div class="text-[10px] text-slate-500 italic">No items listed</div>` : '')}
                        </div>
                    `;
                };

                return `
                    <tr class="hover:bg-slate-800/40 transition">
                        <td class="p-3 font-bold text-white align-top border-b border-slate-800">${item.name}</td>
                        <td class="p-3 align-top border-b border-slate-800">${renderCell('Oct 16', 'sleep16', 'food16Category', 'food16Details')}</td>
                        <td class="p-3 align-top border-b border-slate-800">${renderCell('Oct 17', 'sleep17', 'food17Category', 'food17Details')}</td>
                        <td class="p-3 align-top border-b border-slate-800">${renderCell('Oct 18', '', 'food18Category', 'food18Details')}</td>
                    </tr>
                `;
            }).join('');

            // Mobile Card View
            rosterMobileView.innerHTML = activeData.map(item => {
                const daysList = String(item.days || '').split(',').map(d => d.trim());

                const renderMobileDay = (title, dayTag, sleepKey, catKey, detKey) => {
                    if (!daysList.includes(dayTag)) return '';

                    const isSleeping = String(item[sleepKey] || '').toLowerCase() === 'yes';
                    const cat = item[catKey] ? String(item[catKey]).trim() : '';
                    const det = item[detKey] ? String(item[detKey]).trim() : '';

                    return `
                        <div class="bg-feast-dark p-2.5 rounded-lg border border-slate-800 text-xs">
                            <div class="flex justify-between items-center mb-1">
                                <span class="font-bold text-slate-200">${title}</span>
                                ${isSleeping ? '<span class="text-[10px] text-indigo-300 font-medium">⛺ Overnight</span>' : ''}
                            </div>
                            ${cat ? `<div class="text-[10px] text-rose-400 font-bold uppercase">${cat}</div>` : ''}
                            ${det ? `
                                <div class="text-[11px] text-slate-300">
                                    <span class="text-slate-400">${dayTag === 'Oct 16' ? '🎬 Movie: ' : 'Details: '}</span>${det}
                                </div>
                            ` : ''}
                        </div>
                    `;
                };

                return `
                    <div class="bg-feast-card/80 p-3.5 rounded-xl border border-slate-800 space-y-2">
                        <div class="font-bold text-white text-base border-b border-slate-800 pb-1.5 flex justify-between items-center">
                            <span>${item.name}</span>
                            <span class="text-[10px] bg-emerald-950 text-emerald-300 border border-emerald-700/60 px-2 py-0.5 rounded font-bold uppercase">Attending</span>
                        </div>
                        <div class="space-y-1.5 pt-1">
                            ${renderMobileDay('Friday, Oct 16', 'Oct 16', 'sleep16', 'food16Category', 'food16Details')}
                            ${renderMobileDay('Saturday, Oct 17', 'Oct 17', 'sleep17', 'food17Category', 'food17Details')}
                            ${renderMobileDay('Sunday, Oct 18', 'Oct 18', '', 'food18Category', 'food18Details')}
                        </div>
                    </div>
                `;
            }).join('');
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const submitBtn = form.querySelector('button[type="submit"]');
            submitBtn.disabled = true;
            submitBtn.innerText = '★ Saving... ★';

            const formData = new FormData(form);
            const data = {};

            formData.forEach((value, key) => {
                if (key === 'days' || key === 'food16Category' || key === 'food17Category' || key === 'food18Category') {
                    if (!data[key]) data[key] = [];
                    data[key].push(value);
                } else {
                    data[key] = value;
                }
            });

            data.phone = data.phone.replace(/\D/g, '');
            data.sleep16 = form.querySelector('[name="sleep16"]')?.checked ? 'Yes' : 'No';
            data.sleep17 = form.querySelector('[name="sleep17"]')?.checked ? 'Yes' : 'No';

            try {
                await fetch(SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(data)
                });

                showLookupStatus('✓ RSVP submitted successfully!', 'text-emerald-400');
                
                setTimeout(() => {
                    fetchRoster();
                    submitBtn.disabled = false;
                    submitBtn.innerText = '★ Submit / Update Entry ★';
                }, 1800);

            } catch (error) {
                console.error('Submit error:', error);
                alert('Could not save RSVP. Please check connection.');
                submitBtn.disabled = false;
                submitBtn.innerText = '★ Submit / Update Entry ★';
            }
        });

        fetchRoster();
    </script>
</body>
</html>
