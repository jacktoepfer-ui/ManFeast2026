<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MANFEAST 2026 - RSVP & Roster</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'feast-dark': '#0b0f17',
                        'feast-card': '#141c2b',
                        'feast-red': '#dc2626',
                        'feast-crimson': '#e11d48',
                        'feast-blue': '#2563eb',
                        'feast-steel': '#cbd5e1'
                    }
                }
            }
        }
    </script>
    <style>
        .page-bg {
            background-color: #07090e;
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(225, 29, 72, 0.18), transparent 45%),
                radial-gradient(circle at 80% 20%, rgba(37, 99, 235, 0.12), transparent 45%);
            background-attachment: fixed;
        }

        .banner-shadow {
            box-shadow: 0 15px 30px -10px rgba(0, 0, 0, 0.95), 0 0 20px rgba(225, 29, 72, 0.3);
        }
    </style>
</head>
<body class="page-bg text-gray-100 font-sans min-h-screen p-2.5 sm:p-6 md:p-8">

    <div class="max-w-4xl mx-auto space-y-6 sm:space-y-8">
        
        <!-- Header Banner Section -->
        <div class="flex flex-col items-center">
            <div class="w-full max-w-xl overflow-hidden rounded-xl sm:rounded-2xl border border-rose-700/60 banner-shadow bg-feast-dark relative">
                <img src="banner.JPG" alt="MANFEAST 2026 - Food, Fire & Freedom" class="w-full h-auto object-cover block mx-auto">
            </div>
            
            <div class="mt-3 text-center">
                <span class="inline-block bg-rose-950/90 text-slate-100 border border-rose-600/70 px-3.5 py-1 rounded-full text-[10px] sm:text-xs font-black uppercase tracking-widest shadow-md">
                    ★ GUYS WEEKEND • FOOD, FIRE & FREEDOM ★
                </span>
            </div>
        </div>

        <!-- RSVP Form Card -->
        <div class="bg-feast-card p-4 sm:p-6 md:p-8 rounded-xl sm:rounded-2xl border border-slate-700/70 shadow-2xl relative overflow-hidden">
            <div class="absolute top-0 left-0 right-0 h-1 bg-gradient-to-r from-rose-600 via-slate-200 to-blue-600"></div>
            
            <div class="mb-5 border-b border-slate-800 pb-3">
                <h2 class="text-xl sm:text-2xl font-black text-white uppercase tracking-wide flex items-center justify-between">
                    <span>★ RSVP / Edit Registration</span>
                </h2>
                <p class="text-[11px] text-slate-400 mt-0.5">Enter your full name to submit or update an existing entry.</p>
            </div>
            
            <form id="rsvpForm" class="space-y-5">
                <!-- Name & Attending Status -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-300 uppercase tracking-wider mb-1.5">Full Name *</label>
                        <input type="text" name="name" required placeholder="First and Last Name" 
                            class="w-full bg-feast-dark border border-slate-700 rounded-lg px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-rose-500 transition shadow-inner">
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-slate-300 uppercase tracking-wider mb-1.5">Attending Status *</label>
                        <select name="attending" required class="w-full bg-feast-dark border border-slate-700 rounded-lg px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-rose-500 transition shadow-inner">
                            <option value="Yes">Yes, I will be attending!</option>
                            <option value="No">No, unable to make it</option>
                        </select>
                    </div>
                </div>

                <!-- Days & Sleeping Over -->
                <div class="space-y-3 pt-2">
                    <label class="block text-xs font-bold text-slate-300 uppercase tracking-wider">Select Days Attending</label>
                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                        <label class="flex items-center space-x-3 bg-feast-dark p-3.5 rounded-xl border border-slate-800 hover:border-rose-500 cursor-pointer transition">
                            <input type="checkbox" name="days" value="Oct 16" class="day-checkbox w-5 h-5 text-rose-600 rounded border-slate-700 focus:ring-0">
                            <div>
                                <span class="text-xs sm:text-sm font-bold text-white block">Friday, Oct 16</span>
                                <span class="text-[10px] text-slate-400">Arrival & Setup</span>
                            </div>
                        </label>

                        <label class="flex items-center space-x-3 bg-feast-dark p-3.5 rounded-xl border border-slate-800 hover:border-rose-500 cursor-pointer transition">
                            <input type="checkbox" name="days" value="Oct 17" class="day-checkbox w-5 h-5 text-rose-600 rounded border-slate-700 focus:ring-0">
                            <div>
                                <span class="text-xs sm:text-sm font-bold text-white block">Saturday, Oct 17</span>
                                <span class="text-[10px] text-rose-400 font-bold">🔥 THE FEAST DAY</span>
                            </div>
                        </label>

                        <label class="flex items-center space-x-3 bg-feast-dark p-3.5 rounded-xl border border-slate-800 hover:border-blue-500 cursor-pointer transition">
                            <input type="checkbox" name="days" value="Oct 18" class="day-checkbox w-5 h-5 text-blue-600 rounded border-slate-700 focus:ring-0">
                            <div>
                                <span class="text-xs sm:text-sm font-bold text-white block">Sunday, Oct 18</span>
                                <span class="text-[10px] text-slate-400">Breakfast & Pack Up</span>
                            </div>
                        </label>
                    </div>

                    <!-- Overnight Stay Options -->
                    <div class="flex flex-col sm:flex-row gap-3 sm:gap-6 pt-2 px-1">
                        <label class="inline-flex items-center space-x-2 cursor-pointer">
                            <input type="checkbox" name="sleep16" value="Yes" class="w-4 h-4 text-indigo-500 rounded border-slate-700">
                            <span class="text-xs text-indigo-300 font-medium">⛺ Sleeping Over Friday Night (Oct 16)</span>
                        </label>
                        <label class="inline-flex items-center space-x-2 cursor-pointer">
                            <input type="checkbox" name="sleep17" value="Yes" class="w-4 h-4 text-indigo-500 rounded border-slate-700">
                            <span class="text-xs text-indigo-300 font-medium">⛺ Sleeping Over Saturday Night (Oct 17)</span>
                        </label>
                    </div>
                </div>

                <!-- Dynamic Daily Food Fields -->
                <div class="space-y-4 pt-3 border-t border-slate-800">
                    <h3 class="text-xs font-bold text-rose-400 uppercase tracking-wider">Food & Drink Contributions</h3>
                    
                    <!-- Oct 16 Food -->
                    <div id="foodBlock16" class="hidden bg-feast-dark p-3.5 rounded-xl border border-rose-900/60 grid grid-cols-1 sm:grid-cols-3 gap-3">
                        <div>
                            <label class="block text-[10px] font-bold text-rose-400 uppercase mb-1">Oct 16 Category</label>
                            <select name="food16Category" class="w-full bg-feast-card border border-slate-700 rounded-lg px-3 py-2 text-xs text-white focus:border-rose-500">
                                <option value="">Select Category...</option>
                                <option value="Main / Grill Item">Main / Grill Item</option>
                                <option value="Side Dish">Side Dish</option>
                                <option value="Snacks & Appetizers">Snacks & Appetizers</option>
                                <option value="Beer / Alcohol">Beer / Alcohol</option>
                                <option value="Non-Alcoholic Drinks">Non-Alcoholic Drinks</option>
                                <option value="Cigars / Tobacco">Cigars / Tobacco</option>
                                <option value="Supplies / Paper Goods">Supplies / Paper Goods</option>
                            </select>
                        </div>
                        <div class="sm:col-span-2">
                            <label class="block text-[10px] font-bold text-rose-400 uppercase mb-1">Oct 16 Dish / Item Details</label>
                            <input type="text" name="food16Details" placeholder="e.g. Case of IPA beer & potato chips" class="w-full bg-feast-card border border-slate-700 rounded-lg px-3 py-2 text-xs text-white focus:border-rose-500">
                        </div>
                    </div>

                    <!-- Oct 17 Food -->
                    <div id="foodBlock17" class="hidden bg-feast-dark p-3.5 rounded-xl border border-rose-800/80 grid grid-cols-1 sm:grid-cols-3 gap-3">
                        <div>
                            <label class="block text-[10px] font-bold text-rose-300 uppercase mb-1">Oct 17 Category</label>
                            <select name="food17Category" class="w-full bg-feast-card border border-slate-700 rounded-lg px-3 py-2 text-xs text-white focus:border-rose-500">
                                <option value="">Select Category...</option>
                                <option value="Main / Feast Meat">Main / Feast Meat</option>
                                <option value="Side Dish / BBQ">Side Dish / BBQ</option>
                                <option value="Dessert">Dessert</option>
                                <option value="Bourbon / Whiskey">Bourbon / Whiskey</option>
                                <option value="Craft Beer">Craft Beer</option>
                                <option value="Cigars / Freedom Reserve">Cigars / Freedom Reserve</option>
                                <option value="Ice / Charcoal / Wood">Ice / Charcoal / Wood</option>
                            </select>
                        </div>
                        <div class="sm:col-span-2">
                            <label class="block text-[10px] font-bold text-rose-300 uppercase mb-1">Oct 17 Dish / Item Details</label>
                            <input type="text" name="food17Details" placeholder="e.g. Smoked Pork Ribs & BBQ Sauce" class="w-full bg-feast-card border border-slate-700 rounded-lg px-3 py-2 text-xs text-white focus:border-rose-500">
                        </div>
                    </div>

                    <!-- Oct 18 Food -->
                    <div id="foodBlock18" class="hidden bg-feast-dark p-3.5 rounded-xl border border-blue-900/60 grid grid-cols-1 sm:grid-cols-3 gap-3">
                        <div>
                            <label class="block text-[10px] font-bold text-blue-400 uppercase mb-1">Oct 18 Category</label>
                            <select name="food18Category" class="w-full bg-feast-card border border-slate-700 rounded-lg px-3 py-2 text-xs text-white focus:border-blue-500">
                                <option value="">Select Category...</option>
                                <option value="Breakfast Meat">Breakfast Meat</option>
                                <option value="Eggs / Casserole">Eggs / Casserole</option>
                                <option value="Bread / Bagels / Rolls">Bread / Bagels / Rolls</option>
                                <option value="Coffee / Juice">Coffee / Juice</option>
                                <option value="Pack Up / Cleanup Supplies">Pack Up / Cleanup Supplies</option>
                            </select>
                        </div>
                        <div class="sm:col-span-2">
                            <label class="block text-[10px] font-bold text-blue-400 uppercase mb-1">Oct 18 Dish / Item Details</label>
                            <input type="text" name="food18Details" placeholder="e.g. 2 Packs Bacon & Box of Coffee" class="w-full bg-feast-card border border-slate-700 rounded-lg px-3 py-2 text-xs text-white focus:border-blue-500">
                        </div>
                    </div>
                </div>

                <button type="submit" class="w-full bg-gradient-to-r from-rose-700 via-rose-600 to-blue-800 hover:from-rose-600 hover:to-blue-700 text-white font-black py-3.5 rounded-xl transition duration-200 shadow-lg uppercase tracking-wider text-xs sm:text-sm border border-slate-600/50 mt-4">
                    ★ Submit / Update Entry ★
                </button>
            </form>
        </div>

        <!-- Roster Section -->
        <div class="bg-feast-card p-4 sm:p-6 md:p-8 rounded-xl sm:rounded-2xl border border-slate-700/70 shadow-2xl relative overflow-hidden">
            <div class="absolute top-0 left-0 right-0 h-1 bg-gradient-to-r from-blue-600 via-slate-200 to-rose-600"></div>

            <div class="flex flex-row items-center justify-between gap-2 mb-4 border-b border-slate-800 pb-3">
                <h2 class="text-lg sm:text-2xl font-black text-white uppercase tracking-wide">
                    ★ Master Roster
                </h2>
                <button onclick="fetchRoster()" class="text-[11px] sm:text-xs bg-feast-dark hover:bg-slate-800 text-slate-200 border border-slate-700 px-3 py-1.5 rounded-lg font-bold transition">
                    ↻ Refresh
                </button>
            </div>

            <!-- Mobile View (Stacked Cards) -->
            <div id="rosterMobileView" class="block md:hidden space-y-3">
                <div class="text-center py-6 text-xs text-slate-400">Loading roster...</div>
            </div>

            <!-- Desktop View (Table) -->
            <div class="hidden md:block overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-feast-dark border-b border-slate-700 text-xs text-slate-300 uppercase tracking-wider">
                            <th class="p-3">Attendee Name</th>
                            <th class="p-3">Friday (Oct 16)</th>
                            <th class="p-3">Saturday (Oct 17)</th>
                            <th class="p-3">Sunday (Oct 18)</th>
                        </tr>
                    </thead>
                    <tbody id="rosterTableBody" class="divide-y divide-slate-800 text-sm">
                        <tr>
                            <td colspan="4" class="text-center py-8 text-slate-400">Loading roster entries...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz4uLEmNo047VUJ03SAISxchr4e9EXF7P7c-jAmNjQiqrWUBv1685a4ulT9H5qLvsnx/exec";

        const form = document.getElementById('rsvpForm');
        const rosterTableBody = document.getElementById('rosterTableBody');
        const rosterMobileView = document.getElementById('rosterMobileView');
        const dayCheckboxes = document.querySelectorAll('.day-checkbox');

        // Dynamic Food Inputs Visibility Toggle
        dayCheckboxes.forEach(cb => {
            cb.addEventListener('change', () => {
                const dayVal = cb.value;
                let blockId = '';
                if (dayVal === 'Oct 16') blockId = 'foodBlock16';
                if (dayVal === 'Oct 17') blockId = 'foodBlock17';
                if (dayVal === 'Oct 18') blockId = 'foodBlock18';

                const block = document.getElementById(blockId);
                if (block) {
                    if (cb.checked) {
                        block.classList.remove('hidden');
                    } else {
                        block.classList.add('hidden');
                    }
                }
            });
        });

        async function fetchRoster() {
            try {
                const response = await fetch(SCRIPT_URL, { redirect: "follow" });
                const data = await response.json();
                renderRoster(data);
            } catch (error) {
                console.error('Error fetching roster:', error);
                const errorHtml = '<div class="text-center py-6 text-xs text-rose-400 font-semibold">Error loading roster. Check script URL connection.</div>';
                rosterMobileView.innerHTML = errorHtml;
                rosterTableBody.innerHTML = `<tr><td colspan="4">${errorHtml}</td></tr>`;
            }
        }

        function renderRoster(data) {
            if (!data || data.length === 0) {
                const emptyHtml = '<div class="text-center py-6 text-xs text-slate-400">No RSVP submissions yet.</div>';
                rosterMobileView.innerHTML = emptyHtml;
                rosterTableBody.innerHTML = `<tr><td colspan="4">${emptyHtml}</td></tr>`;
                return;
            }

            const activeData = data.filter(row => 
                row.name && 
                String(row.name).trim().toLowerCase() !== 'name' && 
                String(row.attending).trim().toLowerCase() === 'yes'
            );

            if (activeData.length === 0) {
                const emptyHtml = '<div class="text-center py-6 text-xs text-slate-400">No attendees currently registered as attending.</div>';
                rosterMobileView.innerHTML = emptyHtml;
                rosterTableBody.innerHTML = `<tr><td colspan="4">${emptyHtml}</td></tr>`;
                return;
            }

            // Desktop Table View
            rosterTableBody.innerHTML = activeData.map(item => {
                const daysAttending = String(item.days || '');

                const renderDayCell = (dayTag, sleepKey, catKey, detKey) => {
                    if (!daysAttending.includes(dayTag)) {
                        return '<span class="text-slate-600 text-xs italic">Not attending</span>';
                    }

                    const isSleeping = String(item[sleepKey] || '').toLowerCase() === 'yes';
                    const category = item[catKey] ? String(item[catKey]).trim() : '';
                    const details = item[detKey] ? String(item[detKey]).trim() : '';

                    return `
                        <div class="space-y-1">
                            <div class="flex flex-wrap gap-1">
                                <span class="text-[10px] bg-emerald-950 text-emerald-300 border border-emerald-700/60 px-1.5 py-0.5 rounded font-bold uppercase">Attending</span>
                                ${isSleeping ? '<span class="text-[10px] bg-indigo-950 text-indigo-200 border border-indigo-700/60 px-1.5 py-0.5 rounded font-bold uppercase">⛺ Overnight</span>' : ''}
                            </div>
                            ${details ? `
                                <div class="text-xs pt-1">
                                    <strong class="text-rose-400 uppercase text-[10px] block">${category || 'Contribution'}:</strong>
                                    <span class="text-slate-200">${details}</span>
                                </div>
                            ` : '<div class="text-[10px] text-slate-500 italic">No food item listed</div>'}
                        </div>
                    `;
                };

                return `
                    <tr class="hover:bg-slate-800/40 transition">
                        <td class="p-3 font-bold text-white align-top border-b border-slate-800">${item.name}</td>
                        <td class="p-3 align-top border-b border-slate-800">${renderDayCell('Oct 16', 'sleep16', 'food16Category', 'food16Details')}</td>
                        <td class="p-3 align-top border-b border-slate-800">${renderDayCell('Oct 17', 'sleep17', 'food17Category', 'food17Details')}</td>
                        <td class="p-3 align-top border-b border-slate-800">${renderDayCell('Oct 18', '', 'food18Category', 'food18Details')}</td>
                    </tr>
                `;
            }).join('');

            // Mobile Card View
            rosterMobileView.innerHTML = activeData.map(item => {
                const daysAttending = String(item.days || '');

                const renderMobileDay = (dayTitle, dayTag, sleepKey, catKey, detKey) => {
                    if (!daysAttending.includes(dayTag)) return '';

                    const isSleeping = String(item[sleepKey] || '').toLowerCase() === 'yes';
                    const category = item[catKey] ? String(item[catKey]).trim() : '';
                    const details = item[detKey] ? String(item[detKey]).trim() : '';

                    return `
                        <div class="bg-feast-dark p-2.5 rounded-lg border border-slate-800 text-xs">
                            <div class="flex justify-between items-center mb-1">
                                <span class="font-bold text-slate-200">${dayTitle}</span>
                                ${isSleeping ? '<span class="text-[10px] text-indigo-300 font-medium">⛺ Overnight</span>' : ''}
                            </div>
                            ${details ? `
                                <div class="text-[11px] text-slate-300">
                                    <span class="text-rose-400 font-semibold">${category ? category + ': ' : ''}</span>${details}
                                </div>
                            ` : '<div class="text-[10px] text-slate-500 italic">No food item specified</div>'}
                        </div>
                    `;
                };

                return `
                    <div class="bg-feast-card/80 p-3.5 rounded-xl border border-slate-800 space-y-2">
                        <div class="font-bold text-white text-base border-b border-slate-800 pb-1.5 flex justify-between items-center">
                            <span>${item.name}</span>
                            <span class="text-[10px] bg-emerald-950 text-emerald-300 border border-emerald-700/60 px-2 py-0.5 rounded font-bold uppercase">Attending</span>
                        </div>
                        <div class="space-y-1.5 pt-1">
                            ${renderMobileDay('Friday, Oct 16', 'Oct 16', 'sleep16', 'food16Category', 'food16Details')}
                            ${renderMobileDay('Saturday, Oct 17', 'Oct 17', 'sleep17', 'food17Category', 'food17Details')}
                            ${renderMobileDay('Sunday, Oct 18', 'Oct 18', '', 'food18Category', 'food18Details')}
                        </div>
                    </div>
                `;
            }).join('');
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const submitBtn = form.querySelector('button[type="submit"]');
            submitBtn.disabled = true;
            submitBtn.innerText = '★ Submitting... ★';

            const formData = new FormData(form);
            const data = {};

            formData.forEach((value, key) => {
                if (key === 'days') {
                    if (!data[key]) data[key] = [];
                    data[key].push(value);
                } else {
                    data[key] = value;
                }
            });

            data.sleep16 = form.querySelector('[name="sleep16"]')?.checked ? 'Yes' : 'No';
            data.sleep17 = form.querySelector('[name="sleep17"]')?.checked ? 'Yes' : 'No';

            try {
                await fetch(SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(data)
                });

                form.reset();
                
                ['foodBlock16', 'foodBlock17', 'foodBlock18'].forEach(id => {
                    const block = document.getElementById(id);
                    if (block) block.classList.add('hidden');
                });

                setTimeout(() => {
                    fetchRoster();
                    submitBtn.disabled = false;
                    submitBtn.innerText = '★ Submit / Update Entry ★';
                }, 2000);

            } catch (error) {
                console.error('Error submitting RSVP:', error);
                alert('Could not submit RSVP. Please try again.');
                submitBtn.disabled = false;
                submitBtn.innerText = '★ Submit / Update Entry ★';
            }
        });

        fetchRoster();
    </script>
</body>
</html>
